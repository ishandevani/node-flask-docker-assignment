services:
  frontend:
    build:
      context: ./frontend
    image: sdfanfskdnf/fullstack-frontend:1.0
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: sdfanfskdnf/fullstack-backend:1.0
    container_name: backend
    ports:
      - "5000:5000"
    restart: unless-stopped

networks:
  default:
    name: fullstack-network
